      responses:
        "200":
          description: The history, oldest week first.
          headers: *dataHeaders
          content:
            application/json:
              example:
                {
                  "id": "mdid-3bk6kdti",
                  "title": "Weak Dragon's Covenanted Harem",
                  "weeksOnChart": 2,
                  "peak": 1,
                  "weeks":
                    [
                      { "week": "2026-W39", "rank": 4, "move": "new", "lastWeek": null },
                      { "week": "2026-W40", "rank": 1, "move": "up", "lastWeek": 4 },
                    ],
                  "license": "CC BY 4.0",
                  "licenseUrl": "https://creativecommons.org/licenses/by/4.0/",
                  "attribution": "Data from MicroDramaList (https://microdramalist.com)",
                }
              schema:
                allOf:
                  - type: object
                    required: [id, title, weeksOnChart, peak, weeks]
                    properties:
                      id: { type: string }
                      title: { type: string }
                      weeksOnChart: { type: integer }
                      peak: { type: [integer, "null"], description: "Best rank; null when never on the chart." }
                      weeks:
                        type: array
                        items:
                          type: object
                          required: [week, rank, move, lastWeek]
                          properties:
                            week: { $ref: "#/components/schemas/IsoWeek" }
                            rank: { type: integer, minimum: 1 }
                            move: { $ref: "#/components/schemas/ChartMove" }
                            lastWeek: { type: [integer, "null"] }
                  - $ref: "#/components/schemas/License"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TokenRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/charts/weekly:
    get:
      operationId: listChartWeeks
      tags: ["Charts"]
      summary: Every frozen week of the Top 20
      security:
        - bearer: []
      responses:
        "200":
          description: The weeks, newest first.
          headers: *dataHeaders
          content:
            application/json:
              example:
                {
                  "weeks":
                    [
                      { "week": "2026-W40", "startsOn": "2026-09-28", "url": "/api/v1/charts/weekly/2026-W40" },
                      { "week": "2026-W39", "startsOn": "2026-09-21", "url": "/api/v1/charts/weekly/2026-W39" },
                    ],
                  "license": "CC BY 4.0",
                  "licenseUrl": "https://creativecommons.org/licenses/by/4.0/",
                  "attribution": "Data from MicroDramaList (https://microdramalist.com)",
                }
              schema:
                allOf:
                  - type: object
                    required: [weeks]
                    properties:
                      weeks:
                        type: array
                        items:
                          type: object
                          required: [week, startsOn, url]
                          properties:
                            week: { $ref: "#/components/schemas/IsoWeek" }
                            startsOn: { type: string, format: date }
                            url: { type: string, description: "This week's chart, a path on this API." }
                  - $ref: "#/components/schemas/License"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TokenRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/charts/weekly/{week}:
    get:
      operationId: getChartWeek
      tags: ["Charts"]
      summary: One week's Top 20
      description: The week's entries with rank, movement, peak and weeks on chart.
      security:
        - bearer: []
      parameters:
        - name: week
          in: path
          required: true
          example: latest
          description: An ISO week such as `2026-W40`, or `latest`. Anything else, or a week without a chart, is a 404 (`no such week`).
          schema:
            type: string
            examples: [2026-W40, latest]
      responses:
        "200":
          description: The chart.
          headers: *dataHeaders
          content:
            application/json:
              example:
                {
                  "week": "2026-W40",
                  "startsOn": "2026-09-28",
                  "entries":
                    [
                      {
                        "rank": 1,
                        "move": "up",
                        "lastWeek": 4,
                        "peak": 1,
                        "weeksOnChart": 2,
                        "id": "mdid-3bk6kdti",
                        "title": "Weak Dragon's Covenanted Harem",
                        "url": "https://microdramalist.com/drama/weak-dragon-s-covenanted-harem",
                      },
                      {
                        "rank": 2,
                        "move": "new",
                        "lastWeek": null,
                        "peak": 2,
                        "weeksOnChart": 1,
                        "id": "mdid-cl0ypmnb",
                        "title": "7 Months Pregnant, Doing Chores for Checkup Money",
                        "url": "https://microdramalist.com/drama/7-months-pregnant-doing-chores-for-checkup-money",
                      },
                    ],
                  "license": "CC BY 4.0",
                  "licenseUrl": "https://creativecommons.org/licenses/by/4.0/",
                  "attribution": "Data from MicroDramaList (https://microdramalist.com)",
                }
              schema:
                allOf:
                  - type: object
                    required: [week, startsOn, entries]
                    properties:
                      week: { $ref: "#/components/schemas/IsoWeek" }
                      startsOn: { type: string, format: date }
                      entries:
                        type: array
                        maxItems: 20
                        items: { $ref: "#/components/schemas/ChartEntry" }
                  - $ref: "#/components/schemas/License"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TokenRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: "mdl_ + 43 base64url characters"
      description: |
        A personal token from Settings > API token (signed in, email
        verified; one token an account). It is shown once; we keep only its
        SHA-256. In Settings the token can be regenerated (a new secret, the
        old one stops working at once), disabled and enabled again, or
        deleted for good (and a new one created). Unknown, disabled and
        deleted tokens are 401.
    session:
      type: apiKey
      in: cookie
      name: session
      description: |
        The site's own sign-in session, what the browser's forms send. The
        two request endpoints take it or a bearer token; everything else
        that needs an account takes the token alone.

  parameters:
    DramaId:
      name: id
      in: path
      required: true
      description: A public drama id.
      example: mdid-r229ssxt
      schema:
        type: string
        examples: [mdid-r229ssxt]
    # The scope parameters (lib/dataApi.ts readScope; Go:
    # internal/site/pages/dataapi). Empty means "all". Platform and
    # language are lower-cased before the check.
    Platform:
      name: platform
      in: query
      example: dramabox
      description: "An app's slug, as /api/v1/stats/platforms lists them. Otherwise a 400 (`platform: a platform slug, as /api/v1/stats/platforms lists`)."
      schema:
        type: string
        pattern: "^[a-z0-9_-]{1,40}$"
        examples: [dramabox]
    Language:
      name: language
      in: query
      example: eng
      description: "A language code such as `eng`, `spa`, `ind`. Otherwise a 400 (`language: a language code such as eng, spa, ind`)."
      schema:
        type: string
        pattern: "^[a-z]{2,3}(-[a-z]{2,4})?$"
        examples: [eng]
    Genre:
      name: genre
      in: query
      example: Revenge
      description: "A genre tag exactly as /api/v1/stats/genres lists it (letters, digits, spaces and ' & + . / -). Otherwise a 400 (`genre: a genre tag as /api/v1/stats/genres lists`)."
      schema:
        type: string
        pattern: "^[\\p{L}\\p{N} '&+./-]{1,60}$"
        examples: [Revenge]
    Tags:
      name: tags
      in: query
      example: platform
      description: "`platform` (the apps' own tags, the default) or `all` (adds our tagging). Otherwise a 400 (`tags: platform (the apps' own tags, default) or all`)."
      schema:
        $ref: "#/components/schemas/TagSource"

  headers:
    X-RateLimit-Limit:
      description: Requests allowed per minute (per token for data endpoints, across every server; per address for free ones).
      schema: { type: integer }
    X-RateLimit-Remaining:
      description: Requests left in the current minute.
      schema: { type: integer }
    X-RateLimit-Reset:
      description: When the minute window resets, in Unix seconds.
      schema: { type: integer }
    X-RateLimit-Hourly-Limit:
      description: Requests allowed per hour (300 per token, 150 per address on the free endpoints; since 2026-10-18), across every server.
      schema: { type: integer }
    X-RateLimit-Hourly-Remaining:
      description: Requests left in the current hour window.
      schema: { type: integer }
    X-RateLimit-Hourly-Reset:
      description: When the hour window resets, in Unix seconds.
      schema: { type: integer }
    X-RateLimit-Daily-Limit:
      description: On the free endpoints' daily refusal only (1,000 per address per UTC day; a token has no daily limit since 2026-10-18).
      schema: { type: integer }
    X-RateLimit-Daily-Remaining:
      description: Requests left today (UTC), 0 on the daily refusal.
      schema: { type: integer }
    Retry-After:
      description: Seconds to wait before trying again.
      schema: { type: integer }
    Cache-Control-Public:
      description: "`public, max-age=300`: cached 5 minutes."
      schema: { type: string }
    Cache-Control-Private:
      description: "`private, no-store`: a token's answers are never kept by a shared cache."
      schema: { type: string }

  responses:
    BadRequest:
      description: A parameter refused; `error` names it and what it accepts. Carries the token's rate headers.
      headers: *dataHeaders
      content:
        application/json:
          example: { "error": "platform: a platform slug, as /api/v1/stats/platforms lists" }
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "No published drama with this id (`not found`), or no such chart week (`no such week`). Carries the token's rate headers."
      headers: *dataHeaders
      content:
        application/json:
          example: { "error": "not found" }
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        No token, a malformed one (`an API token is required: create one in
        Settings > API tokens and send it as Authorization: Bearer
        <token>`), an unknown or revoked one (`unknown or revoked API
        token`), or one its owner disabled in Settings (`this API token is
        disabled; enable it in Settings > API tokens`). Never charged
        against a limit.
      headers:
        WWW-Authenticate:
          description: '`Bearer realm="microdramalist"` (no token) or `Bearer error="invalid_token"`.'
          schema: { type: string }
        Cache-Control:
          description: "`no-store`."
          schema: { type: string }
      content:
        application/json:
          example:
            {
              "error": "an API token is required: create one in Settings > API tokens and send it as Authorization: Bearer <token>",
            }
          schema: { $ref: "#/components/schemas/Error" }
    TokenRateLimited:
      description: |
        Over 60 requests this minute (`rate limit exceeded (per minute)`,
        with the minute headers) or 300 this hour (`rate limit exceeded (per
        hour)`, with the hourly headers; Retry-After counts to the window's
        end). No daily limit since 2026-10-18.
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
        X-RateLimit-Hourly-Limit: { $ref: "#/components/headers/X-RateLimit-Hourly-Limit" }
        X-RateLimit-Hourly-Remaining: { $ref: "#/components/headers/X-RateLimit-Hourly-Remaining" }
        X-RateLimit-Hourly-Reset: { $ref: "#/components/headers/X-RateLimit-Hourly-Reset" }
        Cache-Control:
          description: "`no-store`."
          schema: { type: string }
      content:
        application/json:
          example: { "error": "rate limit exceeded (per minute)" }
          schema: { $ref: "#/components/schemas/Error" }
    FreeRateLimited:
      description: 'Over 30 requests this minute from this address (`{"error": "rate limit exceeded"}`), 150 this hour (`rate limit exceeded (per hour): ...`, the hourly headers, Retry-After to the window''s end) or 1,000 today (`anonymous daily limit reached: ...` naming the free token, the daily headers, Retry-After to 00:00 UTC). Since 2026-10-18.'
      headers:
        X-RateLimit-Daily-Limit: { $ref: "#/components/headers/X-RateLimit-Daily-Limit" }
        X-RateLimit-Daily-Remaining: { $ref: "#/components/headers/X-RateLimit-Daily-Remaining" }
        X-RateLimit-Hourly-Limit: { $ref: "#/components/headers/X-RateLimit-Hourly-Limit" }
        X-RateLimit-Hourly-Remaining: { $ref: "#/components/headers/X-RateLimit-Hourly-Remaining" }
        X-RateLimit-Hourly-Reset: { $ref: "#/components/headers/X-RateLimit-Hourly-Reset" }
        Retry-After: { $ref: "#/components/headers/Retry-After" }
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      content:
        application/json:
          example: { "error": "rate limit exceeded" }
          schema: { $ref: "#/components/schemas/Error" }
    SubmissionsRateLimited:
      description: 'Too many requests this hour from this address (`{"error": "Too many submissions. Try again later."}`).'
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/json:
          example: { "error": "Too many submissions. Try again later." }
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Our fault; try again later.
      content:
        application/json:
          example: { "error": "internal error" }
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: "What went wrong, in English." }

    # The CC BY 4.0 block every data response ends with (lib/apiAuth.ts
    # API_LICENSE; Go: dataapi.license).
    License:
      type: object
      required: [license, licenseUrl, attribution]
      properties:
        license: { type: string, const: CC BY 4.0 }
        licenseUrl: { type: string, const: "https://creativecommons.org/licenses/by/4.0/" }
        attribution:
          type: string
          const: Data from MicroDramaList (https://microdramalist.com)
          description: The credit line to show beside anything made from the data.

    TagSource:
      type: string
      enum: [platform, all]
      default: platform

    IsoWeek:
      type: string
      pattern: "^\\d{4}-W\\d{2}$"
      examples: [2026-W40]

    ChartMove:
      type: string
      enum: [up, down, same, new, reentry]
      description: Against the week before; `reentry` is back after a gap (or last week has no chart).

    Drama:
      type: object
      required:
        [
          id,
          title,
          alternativeTitles,
          genres,
          episodeCount,
          releaseYear,
          languages,
          upvotes,
          downvotes,
          description,
          posterUrl,
          availableOn,
        ]
      properties:
        id: { type: string }
        title: { type: string }
        alternativeTitles: { type: array, items: { type: string } }
        genres: { type: array, items: { type: string } }
        episodeCount: { type: [integer, "null"] }
        releaseYear: { type: [integer, "null"] }
        languages: { type: array, items: { type: string }, description: "The live listings' languages." }
        upvotes: { type: integer }
        downvotes: { type: integer }
        description: { type: [string, "null"], description: "Our rewritten description; null until written." }
        posterUrl: { type: [string, "null"], format: uri, description: "Through our image proxy." }
        availableOn:
          type: array
          items:
            type: object
            required: [platform, url, unverified, language, dubbed, additionalAttributes, externalId, lastCheckedAt]
            properties:
              platform: { type: string, description: "The app's display name." }
              url:
                {
                  type: string,
                  description: "The link a reader follows (the app's homepage for an unverified listing).",
                }
              unverified: { type: boolean }
              language: { type: [string, "null"] }
              dubbed: { type: boolean }
              additionalAttributes: { type: array, items: { type: string } }
              externalId: { type: [string, "null"] }
              lastCheckedAt: { type: string, format: date-time }

    SearchResult:
      type: object
      required: [id, title, posterUrl, description]
      properties:
        id: { type: string }
        title: { type: string }
        posterUrl: { type: [string, "null"] }
        description: { type: [string, "null"] }

    ShowRequestReply:
      type: object
      required: [matched]
      properties:
        matched: { type: boolean, description: "The URL is on an app we cover." }
        alreadyAdded: { type: boolean, description: "Present when matched: the show is already in the catalogue." }
        dramaSlug: { type: string, description: "Present when already added and published: /drama/{dramaSlug}." }

    PlatformStat:
      type: object
      required: [platform, name, enabled, titles, stories, englishShare, episodeMedian]
      properties:
        platform: { type: string, description: "The slug the other endpoints take." }
        name: { type: string }
        enabled: { type: boolean, description: "Still crawled." }
        titles: { type: integer }
        stories: { type: integer }
        englishShare: { type: number, format: double, description: "Percent of titles in English, one decimal." }
        episodeMedian: { type: [number, "null"], format: double }

    GenreStat:
      type: object
      required: [genre, stories, titles, share]
      properties:
        genre: { type: string }
        stories: { type: integer }
        titles: { type: integer }
        share: { type: number, format: double, description: "Percent of the scope's stories, one decimal." }

    # One drama in a list (lib/dataApi.ts ApiDrama).
    ListedDrama:
      type: object
      required: [id, slug, url, title, language, genres, episodeCount, releaseYear, platforms, firstSeen]
      properties:
        id: { type: string }
        slug: { type: string }
        url: { type: string, format: uri }
        title: { type: string }
        language: { type: [string, "null"] }
        genres: { type: array, items: { type: string } }
        episodeCount: { type: [integer, "null"] }
        releaseYear: { type: [integer, "null"] }
        platforms:
          {
            type: array,
            items: { type: string },
            description: "Slugs of the apps with a live listing; filtered by `platform`, that one only (and firstSeen is that listing's).",
          }
        firstSeen: { type: string, format: date-time }

    DramaPage:
      type: object
      required: [page, perPage, dramas, nextPage]
      properties:
        page: { type: integer }
        perPage: { type: integer, const: 50 }
        dramas: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ListedDrama" } }
        nextPage: { type: [integer, "null"], description: "Null on a short (last) page." }

    ChangeEvent:
      type: object
      required: [type, id, url, platform, at]
      properties:
        type: { type: string, enum: [created, updated, pulled] }
        id: { type: string }
        url: { type: string, format: uri }
        platform: { type: [string, "null"], description: "The app a listing was pulled from (pulled only)." }
        at: { type: string, format: date-time }

    WatchListing:
      type: object
      required: [platform, platformName, link, language, dubbed, episodeCount, version, lastChecked]
      properties:
        platform: { type: string }
        platformName: { type: string }
        link:
          {
            type: string,
            description: "Our affiliate link where we have one; the app's homepage for an unverified listing.",
          }
        language: { type: [string, "null"] }
        dubbed: { type: boolean }
        episodeCount: { type: [integer, "null"] }
        version:
          type: object
          required: [id, url, title]
          properties:
            id: { type: string }
            url: { type: string, format: uri }
            title: { type: string }
        lastChecked: { type: string, format: date-time }

    MatchVersion:
      type: object
      required: [id, url, title, language, kind, label, listings]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        title: { type: string }
        language: { type: [string, "null"] }
        kind: { type: string, description: "`original`, or the version's kind (dub, language, ...)." }
        label: { type: [string, "null"] }
        listings:
          type: array
          items:
            type: object
            required: [platform, platformShowId, platformUrl, unverified]
            properties:
              platform: { type: string }
              platformShowId: { type: [string, "null"] }
              platformUrl: { type: string }
              unverified: { type: boolean }

    ChartEntry:
      type: object
      required: [rank, move, lastWeek, peak, weeksOnChart, id, title, url]
      properties:
        rank: { type: integer, minimum: 1 }
        move: { $ref: "#/components/schemas/ChartMove" }
        lastWeek: { type: [integer, "null"] }
        peak: { type: integer, minimum: 1 }
        weeksOnChart: { type: integer, minimum: 1 }
        id: { type: string }
        title: { type: string }
        url: { type: string, format: uri }

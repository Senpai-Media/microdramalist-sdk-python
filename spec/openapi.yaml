  /api/v1/changes:
    get:
      operationId: listChanges
      tags: ["Dramas"]
      summary: What changed since a time
      description: |
        Dramas created, updated (their content changed) and pulled from an
        app since a time, oldest first, up to 1,000 a call -- for keeping a
        copy in sync after loading a data pack. Ask again with `since` set
        to `next` until `complete` is true. At most 31 days back; older,
        start from the latest pack.
      security:
        - bearer: []
      parameters:
        - name: since
          in: query
          example: "2026-10-10T00:00:00Z"
          description: |
            An ISO 8601 time (or date) within the last 31 days; default 24
            hours ago. Anything else is a 400 (`since: an ISO 8601 time
            within the last 31 days`).
          schema:
            type: string
            format: date-time
            # Read as a string in Go (every date-time is, config.yaml's
            # type-mapping): the Node route parses it with JavaScript's
            # Date, which also takes a bare date ("2026-10-10"), and so
            # does the handler (dataapi parseISOTime).
            examples: ["2026-10-10T00:00:00Z"]
      responses:
        "200":
          description: The events.
          headers: *dataHeaders
          content:
            application/json:
              example:
                {
                  "since": "2026-10-10T00:00:00.000Z",
                  "events":
                    [
                      {
                        "type": "updated",
                        "id": "mdid-mk3qnfvl",
                        "url": "https://microdramalist.com/drama/the-twins-requiem",
                        "platform": null,
                        "at": "2026-10-10T00:00:26.967Z",
                      },
                      {
                        "type": "updated",
                        "id": "mdid-ctgxa50b",
                        "url": "https://microdramalist.com/drama/o-milagre-de-natal",
                        "platform": null,
                        "at": "2026-10-10T00:01:15.738Z",
                      },
                    ],
                  "next": "2026-10-10T00:01:15.738Z",
                  "complete": false,
                  "license": "CC BY 4.0",
                  "licenseUrl": "https://creativecommons.org/licenses/by/4.0/",
                  "attribution": "Data from MicroDramaList (https://microdramalist.com)",
                }
              schema:
                allOf:
                  - type: object
                    required: [since, events, next, complete]
                    properties:
                      since: { type: string, format: date-time }
                      events:
                        type: array
                        maxItems: 1000
                        items: { $ref: "#/components/schemas/ChangeEvent" }
                      next:
                        {
                          type: string,
                          format: date-time,
                          description: "The last event's time (or `since` when none): the next call's `since`.",
                        }
                      complete: { type: boolean, description: "False when the 1,000 limit cut the list short." }
                  - $ref: "#/components/schemas/License"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TokenRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }


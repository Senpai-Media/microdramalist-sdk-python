# The MicroDramaList API, every /api/v1 endpoint (2026-10-11,
# docs/api/api-data-plan.md phase 7; the owner: "we should probably use
# oapi-codegen for our API documentation").
#
# This file is the ONE definition of the API:
#   - the Go site's token endpoints implement the server interface
#     oapi-codegen generates from it (internal/site/apigen, `task go:gen`),
#     so a handler that drifts from it fails to compile;
#   - both sites serve it, as written at /openapi.yaml and converted at
#     /openapi.json (api/openapi.json, written by the same `task go:gen`
#     step and checked by api/spec_test.go);
#   - `task api:lint` lints it, and `task api:contract` validates live
#     responses of either stack against it (api/contract_test.go).
#
# OpenAPI 3.1, not 3.0.3: oapi-codegen v2.8.0 (2026-07-17, the version
# go.mod pins as a tool) reads 3.1, including `type: [T, "null"]`, which
# is how every nullable field below is written. Its README: "Initial
# OpenAPI 3.1 support landed with #2336".
#
# Two groups of endpoints (tags Free and Feeds, and Catalogue stats,
# Dramas and Charts):
#   free  -- live before 2026-10-11 and kept free and anonymous (the
#            owner's rule): drama lookup, search, the two requests, and
#            the RSS feed. Their Go handlers predate this file and stay
#            hand-written so their bytes do not change (Dramarr and the
#            e2e suite depend on them); oapi-codegen skips these tags
#            (internal/site/apigen/config.yaml). Described here as they
#            behave.
#   data  -- the token-only data API (phases 3 and 4): bearer token,
#            per-minute and daily limits, CC BY 4.0 block in every body.
#
# Field order inside each schema follows the Node response objects, which
# is the order a reader sees; the Go structs oapi-codegen writes sort
# fields by name, so the two stacks' bodies are JSON-equal, not
# byte-equal.
openapi: 3.1.0

info:
  title: MicroDramaList API
  version: 1.0.0
  summary: The micro drama catalogue as JSON -- lookups, search, counts by genre and platform, the catalogue over time, and the weekly chart.
  description: |
    Two kinds of endpoint:

    - **Free** (Free and Feeds): `/api/v1/dramas/{id}`, `/api/v1/search`,
      `/api/v1/show-requests`, `/api/v1/platform-requests` and the RSS feed
      `/feeds/new.xml`. No token; limited per address.
    - **Data** (Catalogue stats, Dramas, Charts): everything else. Needs a personal token from
      Settings > API token on microdramalist.com, sent as
      `Authorization: Bearer mdl_...`. 60 requests a minute and 300 an
      hour per token (`X-RateLimit-*` and `X-RateLimit-Hourly-*` headers;
      no daily limit since 2026-10-18); over a limit the answer is 429
      with `Retry-After`.

    Words the data endpoints share: a **title** is one drama page (one
    language or dub version); a **story** is the show behind its versions.
    **Platform tags** are the genre tags an app gives a show in its own
    listing; `tags=all` adds the ones our tagging assigned, which inflates
    the top tags. **firstSeen** is when our crawler first saw a title, not
    a release date. Ids are our public ids (`mdid-...`).

    The data is licensed CC BY 4.0: use it for anything, including
    commercially, and credit MicroDramaList with a link. Every data
    response repeats the license in its body.

    ## Terms of use

    The API is for apps, tools and research that use the data and credit
    MicroDramaList; it is not a way to copy the catalogue. Walking every
    drama, or every page of every list, to build a copy of MicroDramaList,
    whatever the business model behind it, is a breach of these terms and
    ends in an immediate, permanent ban of the token, the account and the
    address, without warning. The rate limits are not a quota to fill: a
    normal integration never nears them. If what you are building needs
    more than they allow, ask first through
    [the contact page](https://microdramalist.com/contact).

    ## Getting a token

    Sign in, open [Settings > API token](https://microdramalist.com/settings#api-tokens),
    create your token and copy it: it is shown once, and there is one
    token per account. Send it on every data call as
    `Authorization: Bearer mdl_...`. The search and single-drama
    endpoints need none.

    ## SDKs

    Official clients for [TypeScript and JavaScript](https://github.com/Senpai-Media/microdramalist-sdk-typescript)
    (Node 18+, Bun, Deno, no dependencies) and
    [Python](https://github.com/Senpai-Media/microdramalist-sdk-python)
    (3.10+, sync and async): one method per endpoint, typed errors,
    rate-limit handling and paging. Both read your token from
    `MICRODRAMALIST_TOKEN`. Install them from GitHub (they are not on npm
    or PyPI yet):

    ```sh
    npm install github:Senpai-Media/microdramalist-sdk-typescript
    pip install git+https://github.com/Senpai-Media/microdramalist-sdk-python
    ```

    TypeScript:

    ```ts
    import { MicroDramaList } from "microdramalist";

    const mdl = new MicroDramaList(); // token from MICRODRAMALIST_TOKEN
    const { platforms } = await mdl.getStatsPlatforms();
    ```

    Python:

    ```python
    from microdramalist import MicroDramaList

    with MicroDramaList() as mdl:  # token from MICRODRAMALIST_TOKEN
        platforms = mdl.get_stats_platforms()["platforms"]
    ```

    ## Recipes

    The top genres on DramaBox, from the app's own tags (curl and jq):

    ```sh
    export MDL_TOKEN=mdl_...   # from Settings > API token
    curl -s -H "Authorization: Bearer $MDL_TOKEN" \
      "https://microdramalist.com/api/v1/stats/genres?platform=dramabox" \
      | jq -r '.genres[:5][] | "\(.genre)\t\(.stories)\t\(.share)%"'

    Revenge             876   24.6%
    Strong Female Lead  605   17%
    Romance             501   14.1%
    Counterattack       418   11.7%
    Family Bonds        302   8.5%
    ```

    Werewolf's share of each big app, in Python with only the standard
    library:

    ```python
    import json, os, urllib.request

    TOKEN = os.environ["MDL_TOKEN"]
    BASE = "https://microdramalist.com"

    def get(path):
        req = urllib.request.Request(BASE + path, headers={"Authorization": f"Bearer {TOKEN}"})
        with urllib.request.urlopen(req) as r:
            return json.load(r)

    for p in get("/api/v1/stats/platforms")["platforms"][:6]:
        genres = get(f"/api/v1/stats/genres?platform={p['platform']}")["genres"]
        wolf = next((g for g in genres if g["genre"].lower() == "werewolf"), None)
        print(f"{p['name']:<12} {wolf['share'] if wolf else 0:>5}%  of {p['stories']:,} stories")

    ReelShort      0.2%  of 7,828 stories
    StardustTV       0%  of 6,282 stories
    MoboReels      2.8%  of 3,907 stories
    Kalos TV       1.2%  of 4,571 stories
    ShortTV        0.9%  of 3,911 stories
    NetShort       0.9%  of 2,462 stories
    ```

    Outputs from our catalogue on October 10, 2026. Platform tags only:
    an app that never tags a show "Werewolf" reads 0% even when it
    carries werewolf stories.

    Something missing you would find useful? Write to
    [support@microdramalist.com](mailto:support@microdramalist.com).
  # The license of the data the API serves (the owner's choice, 2026-10-11).
  # The description's "##" sections (Getting a token, SDKs, Recipes) are
  # the /api-docs guide since 2026-10-12: Scalar lists each as a sidebar
  # entry under Introduction, which is why they are here and not in the
  # page (apps/site/src/app/[locale]/(docs)/api-docs/page.tsx, the Go
  # static.ApiDocsBody). The SDK and recipe code is what the retired
  # components/DataApiDocs.tsx and static/dataapi.go carried, run against
  # the local stack before it was written down; outputs as they came back.
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    name: MicroDramaList
    url: https://microdramalist.com/contact
  termsOfService: https://microdramalist.com/terms

# Absolute URLs in responses always use this origin (brand.PrimaryOrigin;
# never the request's Host), whichever host served the call.
servers:
  - url: https://microdramalist.com

# Since 2026-10-12 /api-docs renders this document (the guide is the
# description above), so the external link is the announcement article:
# what the API serves, a first call, the SDKs and the data packs.
externalDocs:
  description: The announcement article, with a first call and the data packs
  url: https://microdramalist.com/articles/microdramalist-api-is-available

# The tags group the reference (2026-10-11, the owner's list for the
# Scalar reference on /api-docs): Free and Feeds need no token; Catalogue
# stats, Dramas and Charts do. internal/site/apigen/config.yaml generates
# Go for the three token tags only.
tags:
  - name: Free
    description: "Free and anonymous, limited per address: 30 a minute for reads, 150 an hour and 1,000 a day (since 2026-10-18; past the day, a 429 until 00:00 UTC asks for a free token, which gets 300 an hour). Live before the data API."
  - name: Catalogue stats
    description: "Token. Counts by platform, genre and language, and the catalogue over time. 60 a minute and 300 an hour per token; CC BY 4.0."
  - name: Dramas
    description: "Token. Filtered lists, what is new, what changed, and one drama across apps."
  - name: Charts
    description: "Token. The weekly MicroDramaList Top 20 and each drama's history on it."
  - name: Feeds
    description: Free RSS, no token; cached 30 minutes.

# The headers every successful data response carries (lib/apiAuth.ts
# authorizeApi; Go: internal/site/pages/dataapi auth.go), written once as a
# YAML anchor and aliased by each data 200 (OpenAPI has no component type
# for a set of headers; JSON output has them expanded). A root extension,
# because an anchor must come before its first alias.
x-dataHeaders: &dataHeaders
  X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
  X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
  X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
  X-RateLimit-Hourly-Limit: { $ref: "#/components/headers/X-RateLimit-Hourly-Limit" }
  X-RateLimit-Hourly-Remaining: { $ref: "#/components/headers/X-RateLimit-Hourly-Remaining" }
  X-RateLimit-Hourly-Reset: { $ref: "#/components/headers/X-RateLimit-Hourly-Reset" }
  Cache-Control: { $ref: "#/components/headers/Cache-Control-Private" }

paths:
  # ------------------------------------------------------------------ free

  /api/v1/dramas/{id}:
    get:
      operationId: getDrama
      tags: ["Free"]
      # Anonymous: no token (the owner's rule, 2026-10-11).
      security: []
      summary: One drama by its public id
      description: |
        The drama's facts, our rewritten description (never the platform's
        text; null until written), a poster through our image proxy, and
        every live listing. An id a duplicate merge folded into another
        drama answers 301 to the surviving drama. 30 requests a minute per
        address, 150 an hour and 1,000 a day without a token (then a 429
        whose `error` says how to get a free token). Cached 5 minutes.
      parameters:
        - $ref: "#/components/parameters/DramaId"
      responses:
        "200":
          description: The drama.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            Cache-Control: { $ref: "#/components/headers/Cache-Control-Public" }
          content:
            application/json:
              example:
                {
                  "id": "mdid-r229ssxt",
                  "title": "Zooton Gone Wrong: Bullying? My 108 Dads Say No.",
                  "alternativeTitles": [],
                  "genres": ["Family", "Tit for Tat", "Grassroots", "Fictional Dynasty"],
                  "episodeCount": null,
                  "releaseYear": null,
                  "languages": [],
                  "upvotes": 1,
                  "downvotes": 0,
                  "description": 'In the heart of Zooton, a city known for its vibrant wildlife and occasional conflicts, a young rabbit named Harper, abandoned at birth, was reared by a formidable group of 108 "gangster" fathers. These fathers, feared by all, hid their identities to protect their unique families. One day, Harper, now grown, attends an exclusive carnivore school where she becomes prey. Despite being bullied and humiliated by a powerful snow leopard heiress, she remains silent. However, a single phone call from Harper changes everything. When her fathers arrive at the school gates, the truth is revealed: the tiniest bunny may have the most dangerous family in the entire city.',
                  "posterUrl": "https://microdramalist.com/api/poster?url=https%3A%2F%2Fakamai-static.shorttv.live%2Fimages%2Fcover%2F2026%2F09%2F11%2F5e19e31b5f1c46dfa396775df5eede44.jpg",
                  "availableOn":
                    [
                      {
                        "platform": "ShortTV",
                        "url": "https://www.shorttv.live/drama/zooton-gone-wrong-bullying-my-108-dads-say-no-38111",
                        "unverified": false,
                        "language": null,
                        "dubbed": false,
                        "additionalAttributes": [],
                        "externalId": null,
                        "lastCheckedAt": "2026-09-22T06:08:19.590Z",
                      },
                    ],
                }
              schema: { $ref: "#/components/schemas/Drama" }
        "301":
          description: The id was merged into another drama; Location is that drama's endpoint.
          headers:
            Location:
              description: "`https://microdramalist.com/api/v1/dramas/{surviving id}`"
              schema: { type: string, format: uri }
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
        "404":
          description: 'No published drama has this id (`{"error": "not found"}`).'
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              example: { "error": "not found" }
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/FreeRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/search:
    get:
      operationId: searchDramas
      tags: ["Free"]
      # Anonymous: no token (the owner's rule, 2026-10-11).
      security: []
      summary: Search dramas by title, or look up a public id
      description: |
        Up to 20 published dramas whose title contains `q` (case-insensitive,
        a literal substring), in title order. A `q` starting with `mdid-` is
        an exact id lookup instead: zero or one result, and an id merged
        into another drama returns that drama. 30 requests a minute per
        address, 150 an hour and 1,000 a day without a token (then a 429
        whose `error` says how to get a free token). Cached 5 minutes.
      parameters:
        - name: q
          in: query
          required: true
          example: billionaire
          description: A title fragment, or a public id (`mdid-...`). Control characters are removed and it is trimmed; nothing left is a 400.
          schema: { type: string, maxLength: 200, examples: [billionaire, mdid-e1lhjmf2] }
      responses:
        "200":
          description: The matches (an empty array when none).
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            Cache-Control: { $ref: "#/components/headers/Cache-Control-Public" }
          content:
            application/json:
              example:
                [
                  {
                    "id": "mdid-ukpy0tzd",
                    "title": "18 Again: My Nemesis Became My Billionaire Husband?!",
                    "posterUrl": "https://microdramalist.com/api/poster?url=https%3A%2F%2Fimg.reelhunter.xyz%2Fcovers%2F8c2ab06e-6917-4177-8ff3-559f6d4ab617.webp",
                    "description": 'Rosa, seorang bintang balet berumur 18 tahun, terbangun selepas 8 tahun untuk menemui bahawa dia telah berkahwin dengan Carl, seorang bilionair yang merupakan musuhnya, dan mereka mempunyai seorang anak. Rosa merasakan hidupnya telah musnah akibat perkahwinan ini. Dia enggan menerima peranan sebagai "wanita jahat" dan memutuskan untuk mengakhiri hubungan tersebut, mengejar semula impian baletnya dan melindungi anaknya. Akhirnya, Rosa sedar bahawa Carl sebenarnya mencintainya.',
                  },
                  {
                    "id": "mdid-e1lhjmf2",
                    "title": "50 & Broke, Then Flash-Married a Billionaire",
                    "posterUrl": "https://microdramalist.com/api/poster?url=https%3A%2F%2Fzshipubcf.farsunpteltd.com%2Fplaylet%2F1747018524_5FE5m3jeRt.jpg%3Fx-oss-process%3Dimage%2Fresize%2Cw_400%2Cimage%2Fformat%2Cwebp",
                    "description": "Catherine, a 50-year-old single mother, lost her daughter Ella and was forced to support her son's wedding through debt. Her daughter-in-law, ungrateful and snobbish, evicted her. Catherine, desperate, rescued Lily, the daughter of Edward, a wealthy businessman. It was revealed that Lily was Catherine's long-lost biological daughter. The family was reunited.",
                  },
                ]
              schema:
                type: array
                maxItems: 20
                items: { $ref: "#/components/schemas/SearchResult" }
        "400":
          description: '`q` missing or empty (`{"error": "q is required"}`).'
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              example: { "error": "q is required" }
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/FreeRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/show-requests:
    post:
      operationId: requestShow
      tags: ["Free"]
      summary: Ask us to add a show by its page URL on an app we cover (signed in, or your API token)
      # Signed in since 2026-10-12 (the owner: every report and request
      # names its account); anonymous from 2026-10-11 until then. The
      # token accepted since that evening (the owner: a show submitted
      # through the API needs a token, so a garbage sender is an account
      # the admin can block).
      description: |
        Needs an account: the browser's session on microdramalist.com, or
        your API token (`Authorization: Bearer mdl_...`, Settings > API
        token) from a script. The request is recorded against that
        account. 20 requests an hour per address; a token call here is
        not counted against the token's data limits.
        The answer says whether the URL belongs to an app we cover
        (`matched`), and whether the show is already in the catalogue
        (`alreadyAdded`, with its page's slug when it is published). A URL
        already queued is not queued twice. A URL on an app we do not
        cover answers `{"matched": false}`: ask for the app with
        /api/v1/platform-requests instead.
      security:
        - session: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  maxLength: 500
                  description: The show's page, http or https.
                  examples: ["https://www.reelshort.com/movie/example-123"]
      responses:
        "200":
          description: Matched (queued, or already in the catalogue) or not matched.
          content:
            application/json:
              example: { "matched": true, "alreadyAdded": false }
              schema: { $ref: "#/components/schemas/ShowRequestReply" }
        "400":
          description: 'Not an http(s) URL of at most 500 characters (`{"error": "Enter a valid URL."}`).'
          content:
            application/json:
              example: { "error": "Enter a valid URL." }
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: 'Not signed in (`{"error": "Sign in to submit a show."}`).'
          content:
            application/json:
              example: { "error": "Sign in to submit a show." }
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/SubmissionsRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/platform-requests:
    post:
      operationId: requestPlatform
      tags: ["Free"]
      summary: Ask us to cover a new app or site (signed in, or your API token)
      description: |
        Needs an account: the browser's session on microdramalist.com, or
        your API token (`Authorization: Bearer mdl_...`) from a script,
        since 2026-10-12. 10 requests an hour per address; a token call
        here is not counted against the token's data limits.
      security:
        - session: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, reason]
              properties:
                url:
                  type: string
                  maxLength: 500
                  description: The app's or site's address, http or https.
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Why it should be added.
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              example: { "ok": true }
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "400":
          description: "A bad URL (`Enter a valid URL.`) or a missing or too long reason (`Tell us a bit about why this platform should be added.`)."
          content:
            application/json:
              example: { "error": "Tell us a bit about why this platform should be added." }
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: 'Not signed in (`{"error": "Sign in to request a new platform."}`).'
          content:
            application/json:
              example: { "error": "Sign in to request a new platform." }
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/SubmissionsRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /feeds/new.xml:
    get:
      operationId: newDramasFeed
      tags: ["Feeds"]
      # Anonymous: no token (the owner's rule, 2026-10-11).
      security: []
      summary: New dramas as RSS 2.0
      description: |
        The dramas our crawler first saw in the last 7 days, newest first,
        50 items, as RSS -- the free twin of /api/v1/new. Filters as the
        data endpoints. Cached 30 minutes by the CDN; 30 requests a minute,
        150 an hour and 1,000 a day per address behind it. Errors here are
        plain text, not JSON, except the hour's and the daily cap's 429s,
        which are the API's JSON `{"error": ...}`.
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Genre"
        - $ref: "#/components/parameters/Language"
      responses:
        "200":
          description: The feed.
          headers:
            Cache-Control:
              description: "`public, max-age=900` (and 30 minutes at the CDN)."
              schema: { type: string }
          content:
            application/rss+xml:
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">
                  <channel>
                    <title>MicroDramaList: new micro dramas (Revenge)</title>
                    <link>https://microdramalist.com/new</link>
                    <atom:link href="https://microdramalist.com/feeds/new.xml?genre=Revenge" rel="self" type="application/rss+xml"/>
                    <description>Micro dramas first seen by MicroDramaList in the last 7 days. Data CC BY 4.0, credit MicroDramaList.</description>
                    <language>en</language>
                    <item>
                      <title>The Fisherman God: Betrayal &amp; Wrath</title>
                      <link>https://microdramalist.com/drama/the-fisherman-god-betrayal-wrath</link>
                      <guid isPermaLink="false">mdid-z1brmjus</guid>
                      <pubDate>Sat, 10 Oct 2026 01:56:36 GMT</pubDate>
                      <description>Modern, Revenge, High Fantasy · on shorttv</description>
                      <category>Modern</category>
                      <category>Revenge</category>
                      <category>High Fantasy</category>
                    </item>
                  </channel>
                </rss>
              schema: { type: string }
        "400":
          description: A parameter refused; the body is the reason, as text.
          content:
            text/plain:
              example: "platform: a platform slug, as /api/v1/stats/platforms lists"
              schema: { type: string }
        "429":
          description: Over 30 a minute from this address (`rate limit exceeded`, text), or over 150 this hour or 1,000 today without a token (JSON, `error` saying so and naming the free token; Retry-After to the window's end or to 00:00 UTC).
          headers:
            Retry-After: { $ref: "#/components/headers/Retry-After" }
          content:
            text/plain:
              example: "rate limit exceeded"
              schema: { type: string }

  # ------------------------------------------------------------------ data

  /api/v1/stats/platforms:
    get:
      operationId: getStatsPlatforms
      tags: ["Catalogue stats"]
      summary: Every app we track, with its size
      description: |
        Per app: titles and stories with a live listing, the share of titles
        in English, and the median episode count (episode counts from 1 to
        300). Largest first. Recomputed at most once an hour.
      security:
        - bearer: []
      responses:
        "200":
          description: The apps.
          headers: *dataHeaders
          content:
            application/json:
              example:
                {
                  "platforms":
                    [
                      {
                        "platform": "reelshort",
                        "name": "ReelShort",
                        "enabled": true,
                        "titles": 18395,
                        "stories": 7828,
                        "englishShare": 16.9,
                        "episodeMedian": 57,
                      },
                      {
                        "platform": "stardusttv",
                        "name": "StardustTV",
                        "enabled": true,
                        "titles": 10568,
                        "stories": 6282,
                        "englishShare": 20.9,
                        "episodeMedian": 59,
                      },
                      {
                        "platform": "moboreels",
                        "name": "MoboReels",
                        "enabled": true,
                        "titles": 7110,
                        "stories": 3907,
                        "englishShare": 29.1,
                        "episodeMedian": 60,
                      },
                    ],
                  "license": "CC BY 4.0",
                  "licenseUrl": "https://creativecommons.org/licenses/by/4.0/",
                  "attribution": "Data from MicroDramaList (https://microdramalist.com)",
                }
              schema:
                allOf:
                  - type: object
                    required: [platforms]
                    properties:
                      platforms:
                        type: array
                        items: { $ref: "#/components/schemas/PlatformStat" }
                  - $ref: "#/components/schemas/License"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TokenRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/stats/genres:
    get:
      operationId: getStatsGenres
      tags: ["Catalogue stats"]
      summary: Stories per genre tag in a scope
      description: |
        Stories and titles per genre tag for one app (or all), one language
        (or all), with each tag's share of the scope's stories; the 200
        largest tags. Platform tags by default. ReelShort's "Playing Dumb"
        is left out of platform tags: about 2,000 of its listings carry
        that tag and nothing else, an artefact of how they reach us.
        Recomputed at most once an hour.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Language"
        - $ref: "#/components/parameters/Tags"
      responses:
        "200":
          description: The tags, largest first.
          headers: *dataHeaders
          content:
            application/json:
              example:
                {
                  "scope": { "platform": "dramabox", "language": null, "tags": "platform" },
                  "totalStories": 3560,
                  "genres":
                    [
                      { "genre": "Revenge", "stories": 876, "titles": 887, "share": 24.6 },
                      { "genre": "Strong Female Lead", "stories": 605, "titles": 613, "share": 17 },
                      { "genre": "Romance", "stories": 501, "titles": 507, "share": 14.1 },
                    ],
                  "license": "CC BY 4.0",
                  "licenseUrl": "https://creativecommons.org/licenses/by/4.0/",
                  "attribution": "Data from MicroDramaList (https://microdramalist.com)",
                }
              schema:
                allOf:
                  - type: object
                    required: [scope, totalStories, genres]
                    properties:
                      scope:
                        type: object
                        required: [platform, language, tags]
                        properties:
                          platform: { type: [string, "null"] }
                          language: { type: [string, "null"] }
                          tags: { $ref: "#/components/schemas/TagSource" }
                      totalStories:
                        type: integer
                        description: Stories in the scope (with a live listing), the shares' denominator.
                      genres:
                        type: array
                        maxItems: 200
                        items: { $ref: "#/components/schemas/GenreStat" }
                  - $ref: "#/components/schemas/License"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TokenRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/stats/timeline:
    get:
      operationId: getStatsTimeline
      tags: ["Catalogue stats"]
      summary: A genre, or a whole app, over time
      description: |
        Two series. `snapshots`: the catalogue's size in the scope at the
        end of each period, from the nightly catalogue snapshot (from
        2026-10-12; the last snapshot of each period). `firstSeen`: titles
        our crawler first saw in each period -- not release dates, and it
        reaches back before the snapshots began. Without `genre`, the whole
        scope. Recomputed at most once an hour.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Genre"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Language"
        - $ref: "#/components/parameters/Tags"
        - name: interval
          in: query
          example: week
          description: "The period each point covers. Anything else is a 400 (`interval: day, week or month`)."
          schema:
            type: string
            enum: [day, week, month]
            default: week
      responses:
        "200":
          description: The two series, oldest first.
          headers: *dataHeaders
          content:
            application/json:
              example:
                {
                  "scope":
                    {
                      "genre": "Revenge",
                      "platform": "dramabox",
                      "language": null,
                      "tags": "platform",
                      "interval": "week",
                    },
                  "notes":
                    {
                      "snapshots": "catalogue size at the end of each period, from nightly snapshots (first snapshot 2026-10-12)",
                      "firstSeen": "titles our crawler first saw in each period; not release dates",
                    },
                  "snapshots": [{ "period": "2026-10-05", "titles": 887, "stories": 876 }],
                  "firstSeen":
                    [
                      { "period": "2026-09-07", "titles": 908 },
                      { "period": "2026-09-21", "titles": 323 },
                      { "period": "2026-09-28", "titles": 284 },
                      { "period": "2026-10-05", "titles": 266 },
                    ],
                  "license": "CC BY 4.0",
                  "licenseUrl": "https://creativecommons.org/licenses/by/4.0/",
                  "attribution": "Data from MicroDramaList (https://microdramalist.com)",
                }
              schema:
                allOf:
                  - type: object
                    required: [scope, notes, snapshots, firstSeen]
                    properties:
                      scope:
                        type: object
                        required: [genre, platform, language, tags, interval]
                        properties:
                          genre: { type: [string, "null"] }
                          platform: { type: [string, "null"] }
                          language: { type: [string, "null"] }
                          tags: { $ref: "#/components/schemas/TagSource" }
                          interval: { type: string, enum: [day, week, month] }
                      notes:
                        type: object
                        required: [snapshots, firstSeen]
                        description: What each series means, in words.
                        properties:
                          snapshots: { type: string }
                          firstSeen: { type: string }
                      snapshots:
                        type: array
                        items:
                          type: object
                          required: [period, titles, stories]
                          properties:
                            period:
                              {
                                type: string,
                                format: date,
                                description: "The period's first day (UTC; weeks start on Monday).",
                              }
                            titles: { type: integer }
                            stories: { type: integer }
                      firstSeen:
                        type: array
                        items:
                          type: object
                          required: [period, titles]
                          properties:
                            period: { type: string, format: date }
                            titles: { type: integer }
                  - $ref: "#/components/schemas/License"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TokenRateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/dramas:
    get:
      operationId: listDramas
      tags: ["Dramas"]
      summary: Published dramas, filtered, 50 a page
      description: |
        Published dramas with a live listing, filtered by genre, app and
        language: newest first (by firstSeen), or most popular on our site
        over the last 30 days (a rank; view counts stay private). Pages 1 to
        200; for more, use filters or the data packs (/data).
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/Genre"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/Language"
        - name: sort
          in: query
          example: popular
          description: "Anything else is a 400 (`sort: new or popular`)."
          schema:
            type: string
            enum: [new, popular]
            default: new
        - name: page
          in: query
          example: 1
          description: "1 to 200; anything else is a 400 (`page: 1 to 200 (use filters or the data packs for more)`)."
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 1
            # Bound as a string in Go: the handler applies the Node route's
            # Number() rule and message itself, in the Node route's order
            # (scope first, then sort, then page).
